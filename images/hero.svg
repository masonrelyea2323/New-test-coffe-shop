<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b4226"/><stop offset="1" stop-color="#2b1810"/></linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.3" r="0.6"><stop offset="0" stop-color="#f3b46b" stop-opacity="0.55"/><stop offset="1" stop-color="#f3b46b" stop-opacity="0"/></radialGradient>
    <radialGradient id="coffee" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#c58a54"/><stop offset="0.7" stop-color="#8a5130"/><stop offset="1" stop-color="#5a321c"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect y="640" width="1600" height="260" fill="#3a2214"/>
  <rect y="640" width="1600" height="8" fill="#52301c"/>
  <!-- coffee beans scattered -->
  <g fill="#24140b">
    <ellipse cx="820" cy="760" rx="26" ry="17" transform="rotate(-20 820 760)"/>
    <ellipse cx="880" cy="800" rx="26" ry="17" transform="rotate(30 880 800)"/>
    <ellipse cx="1480" cy="740" rx="26" ry="17" transform="rotate(10 1480 740)"/>
    <ellipse cx="1530" cy="790" rx="26" ry="17" transform="rotate(-40 1530 790)"/>
  </g>
  <!-- saucer -->
  <ellipse cx="1160" cy="700" rx="300" ry="60" fill="#e9e1d6"/>
  <ellipse cx="1160" cy="690" rx="230" ry="40" fill="#d8cdbf"/>
  <!-- cup -->
  <path d="M940 470 h440 q0 230 -220 230 q-220 0 -220 -230z" fill="#f7f2ea"/>
  <path d="M1378 500 q90 0 90 70 q0 70 -110 80" fill="none" stroke="#f7f2ea" stroke-width="30"/>
  <ellipse cx="1160" cy="470" rx="220" ry="55" fill="#efe7db"/>
  <ellipse cx="1160" cy="472" rx="196" ry="44" fill="url(#coffee)"/>
  <!-- latte art heart -->
  <path d="M1160 500 c-60 -30 -70 -70 -40 -80 c20 -6 35 6 40 20 c5 -14 20 -26 40 -20 c30 10 20 50 -40 80z" fill="#f4e4cc"/>
  <!-- steam -->
  <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.35">
    <path d="M1100 400 q-30 -50 0 -100 q30 -50 0 -100"/>
    <path d="M1170 390 q-30 -50 0 -100 q30 -50 0 -110"/>
    <path d="M1240 400 q-30 -50 0 -100 q30 -50 0 -100"/>
  </g>
</svg>
