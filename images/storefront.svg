  <g fill="#fff"><path d="M150 250 h50 l10 60 h-50z"/><path d="M270 250 h50 l5 60 h-50z"/><path d="M390 250 h50 l0 60 h-50z"/><path d="M510 250 h50 l-5 60 h-50z"/><path d="M630 250 h40 l20 60 h-50z"/></g>
