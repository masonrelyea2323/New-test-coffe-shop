  <circle cx="430" cy="415" r="5" fill="#e87722"/>
  <g stroke="#5a2a1c" stroke-width="6" fill="none"><rect x="120" y="320" width="220" height="170"/><rect x="460" y="320" width="220" height="170"/><path d="M230 320 V490 M570 320 V490"/></g>
  <!-- planters -->
